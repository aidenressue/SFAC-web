<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/apple-touch-icon.png" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your Quote | Shine for a Cause</title>
  <meta name="robots" content="noindex, nofollow" />

  <!-- Open Graph: makes iMessage show a card preview instead of a raw URL -->
  <meta property="og:title" content="Your detailing quote — Shine for a Cause" />
  <meta property="og:description" content="Your options and pricing, ready to book." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://shineforacause.com/brand_assets/link-preview.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --gold:      #C9973A;
      --gold-deep: #A87B27;
      --ink:       #101112;
      --line:      #E2E5EA;
      --line-soft: #EFF1F4;
      --sub:       #4A5261;
      --muted:     #7A8494;
      --page:      #F4F6F8;
      --font-h:    'Montserrat', sans-serif;
      --font-b:    'Inter', sans-serif;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font-family: var(--font-b);
      background: var(--page);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      line-height: 1.55;
    }

    /* ── Top bar: logo left, Book Now + phone right. No menu. ── */
    .bar {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px;
      padding: 10px 18px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }
    .bar-logo { display: flex; align-items: center; flex-shrink: 0; }
    .bar-logo img { height: 60px; width: auto; display: block; }
    .bar-right { display: flex; align-items: center; gap: 10px; }
    .bar-tel {
      font-family: var(--font-h); font-weight: 700; font-size: 14px;
      color: var(--ink); text-decoration: none; white-space: nowrap;
    }
    .bar-tel:hover { color: var(--gold-deep); }
    .bar-book {
      background: var(--gold); color: #fff;
      font-family: var(--font-h); font-weight: 800; font-size: 14px;
      padding: 9px 18px; border-radius: 999px; text-decoration: none;
      white-space: nowrap; transition: background .15s ease, transform .15s ease;
    }
    .bar-book:hover { background: var(--gold-deep); transform: translateY(-1px); }

    @media (max-width: 460px) {
      .bar { padding: 8px 12px; }
      .bar-logo img { height: 46px; }
      .bar-tel { font-size: 13px; }
      .bar-book { font-size: 13px; padding: 8px 14px; }
    }

    /* ── The sheet ── */
    .wrap { max-width: 1040px; margin: 0 auto; padding: 22px 16px 64px; }
    .sheet {
      background: #fff; border: 1px solid var(--line);
      border-radius: 14px; padding: 26px;
      box-shadow: 0 1px 3px rgba(16,17,18,.05), 0 12px 32px rgba(16,17,18,.05);
    }
    @media (max-width: 560px) { .sheet { padding: 18px; border-radius: 12px; } }

    .sheet-head {
      display: flex; justify-content: space-between; gap: 24px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--line); padding-bottom: 18px;
    }
    .biz { display: flex; gap: 14px; align-items: flex-start; }
    .biz img { height: 68px; width: auto; object-fit: contain; }
    .biz h1 { font-family: var(--font-h); font-size: 21px; font-weight: 800; margin: 0; letter-spacing: -.01em; }
    .biz p { margin: 2px 0 0; font-size: 13px; color: var(--sub); }
    .biz .fine { font-size: 12px; color: var(--muted); }
    .meta { text-align: right; font-size: 12px; color: var(--muted); min-width: 150px; }
    .meta .lab {
      font-family: var(--font-h); font-size: 10px; font-weight: 800;
      letter-spacing: .2em; color: var(--muted); text-transform: uppercase;
    }
    .meta b { color: var(--ink); font-weight: 700; }
    @media (max-width: 560px) { .meta { text-align: left; } }

    .facts { display: grid; gap: 18px; margin-top: 18px; }
    @media (min-width: 640px) { .facts { grid-template-columns: 1fr 1fr; } }
    .facts h2 {
      font-family: var(--font-h); font-size: 10px; font-weight: 800;
      letter-spacing: .18em; text-transform: uppercase; color: var(--muted);
      margin: 0 0 6px;
    }
    .facts .who { font-size: 17px; font-weight: 700; margin: 0; }
    .facts p { margin: 0; font-size: 13.5px; color: var(--sub); }
    .save { color: #15803D; font-weight: 700; }

    .cat {
      font-family: var(--font-h); font-size: 11px; font-weight: 800;
      letter-spacing: .18em; text-transform: uppercase; color: var(--muted);
      margin: 26px 0 8px;
    }

    .grid { display: grid; gap: 14px; }
    @media (min-width: 720px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 560px) and (max-width: 719px) { .grid { grid-template-columns: 1fr 1fr; } }

    .card {
      position: relative; display: flex; flex-direction: column;
      background: #fff; border: 1px solid var(--line);
      border-radius: 14px; padding: 18px;
    }
    .card.best {
      border: 2px solid var(--gold);
      box-shadow: 0 8px 24px rgba(201,151,58,.18);
    }
    .badge {
      position: absolute; top: -11px; left: 50%; transform: translateX(-50%);
      background: var(--gold); color: #fff; white-space: nowrap;
      font-family: var(--font-h); font-size: 10px; font-weight: 800;
      letter-spacing: .14em; text-transform: uppercase;
      padding: 4px 12px; border-radius: 999px;
    }
    .tier {
      font-family: var(--font-h); font-size: 10px; font-weight: 800;
      letter-spacing: .18em; text-transform: uppercase; color: var(--gold-deep);
    }
    .name { font-family: var(--font-h); font-size: 19px; font-weight: 800; margin: 4px 0 0; letter-spacing: -.01em; }
    .dur { font-size: 12px; color: var(--muted); margin: 2px 0 0; }
    .plab {
      display: block; margin-top: 12px;
      font-family: var(--font-h); font-size: 10px; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
    }
    .price { font-family: var(--font-h); font-size: 30px; font-weight: 900; letter-spacing: -.02em; }
    /* Struck through in red so the saving reads as a saving, not as small print. */
    .was { color: #DC2626; text-decoration: line-through; text-decoration-color: #DC2626;
           text-decoration-thickness: 2px; font-size: 15px; margin-left: 7px; font-weight: 700; }

    .inc-head {
      margin: 14px 0 8px; padding-bottom: 6px;
      border-bottom: 1px solid var(--line);
      font-family: var(--font-h); font-size: 11px; font-weight: 800;
      letter-spacing: .12em; text-transform: uppercase;
    }
    .side {
      font-family: var(--font-h); font-size: 10px; font-weight: 700;
      letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
      margin: 0 0 5px;
    }
    ul.inc { list-style: none; padding: 0; margin: 0 0 10px; }
    ul.inc:last-child { margin-bottom: 0; }
    ul.inc li {
      display: flex; gap: 8px; align-items: flex-start;
      font-size: 13px; line-height: 1.4; color: var(--sub); margin-bottom: 5px;
    }
    ul.inc li::before {
      content: "✓"; flex: 0 0 15px;
      display: inline-flex; align-items: center; justify-content: center;
      height: 15px; margin-top: 2px; border-radius: 50%;
      background: #16A34A; color: #fff; font-size: 9px; font-weight: 700;
    }

    /* Carries the package into the booking cart, so nothing is re-entered. */
    /* Gold on every card, not only the recommended one — each package is a real
       choice and the badge already says which one we suggest.
       The border is always there, just the same colour as the fill, so the
       hover state does not shift the button by a pixel. */
    .pick {
      display: block; width: 100%; margin-top: 16px; padding: 12px;
      background: var(--gold); color: #fff;
      border: 1px solid var(--gold); border-radius: 11px; cursor: pointer;
      font-family: var(--font-h); font-weight: 800; font-size: 14px;
      transition: background .15s ease, color .15s ease, transform .15s ease;
    }
    .pick:hover, .pick.ghost:hover {
      background: #fff; color: var(--gold-deep);
      border-color: var(--gold); transform: translateY(-1px);
    }
    .lines { margin: 10px 0 0; padding: 0; list-style: none; }
    .lines li { font-size: 12.5px; color: var(--sub); display: flex; justify-content: space-between; gap: 10px; }

    .addons { margin-top: 26px; }
    .addon-grid { display: grid; gap: 9px; }
    @media (min-width: 640px) { .addon-grid { grid-template-columns: 1fr 1fr; } }
    .addon {
      display: flex; justify-content: space-between; gap: 12px;
      border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px;
    }
    .addon .an { font-size: 13.5px; font-weight: 600; margin: 0; }
    .addon .ad { font-size: 12px; color: var(--muted); margin: 2px 0 0; }
    .addon .ai { font-size: 12px; color: #15803D; font-weight: 600; margin: 4px 0 0; }
    .addon .ap { font-size: 13.5px; font-weight: 700; white-space: nowrap; }

    .foot-grid { display: grid; gap: 12px; margin-top: 20px; }
    @media (min-width: 640px) { .foot-grid { grid-template-columns: 1fr 1fr; } }
    .box { background: #F7F8FA; border: 1px solid var(--line-soft); border-radius: 10px; padding: 13px; }
    .box h3 {
      font-family: var(--font-h); font-size: 10px; font-weight: 800;
      letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
      margin: 0 0 5px;
    }
    .box p { margin: 0; font-size: 13px; color: var(--sub); white-space: pre-wrap; }
    .box .tiny { font-size: 11.5px; }
    .box .valid { margin-top: 7px; font-weight: 700; color: var(--ink); font-size: 12px; }

    .cta { margin-top: 22px; text-align: center; }
    .cta h2 { font-family: var(--font-h); font-size: 19px; margin: 0 0 4px; }
    .cta p { color: var(--sub); font-size: 14px; margin: 0 0 14px; }
    .btn {
      display: inline-block; text-align: center;
      background: var(--gold); color: #fff;
      font-family: var(--font-h); font-weight: 800; font-size: 15px;
      padding: 13px 30px; border-radius: 11px; text-decoration: none;
      transition: background .15s ease, transform .15s ease;
    }
    .btn:hover { background: var(--gold-deep); transform: translateY(-1px); }
    .btn.ghost { background: #fff; color: var(--gold-deep); border: 1px solid rgba(201,151,58,.5); margin-left: 8px; }
    .btn.ghost:hover { background: #FCF7EE; }
    @media (max-width: 460px) {
      .btn { display: block; }
      .btn.ghost { margin: 9px 0 0; }
    }

    footer { text-align: center; margin-top: 26px; color: var(--muted); font-size: 12.5px; }
    footer a { color: var(--gold-deep); text-decoration: none; }

    .state { text-align: center; padding: 70px 20px; color: var(--sub); }
    .state h2 { font-family: var(--font-h); color: var(--ink); }
  </style>
  <script src="/ads-attribution.js"></script>
</head>
<body>
  <!-- Logo goes home. Book Now and the phone number sit opposite. No menu on
       purpose: this page has one job. -->
  <header class="bar">
    <a class="bar-logo" href="/" aria-label="Shine for a Cause home">
      <img src="/brand_assets/logo-nav.png" alt="Shine for a Cause" />
    </a>
    <div class="bar-right">
      <a class="bar-tel" href="tel:+19708516433">(970) 851-6433</a>
      <a class="bar-book" href="/booking">Book Now</a>
    </div>
  </header>

  <div class="wrap">
    <div id="content"></div>
    <div class="state" id="loading"><p>Loading your quote…</p></div>
  </div>

  <script>
    // The quote is fetched from the CRM rather than baked into a file, so the
    // customer always sees current pricing and can book straight from it.
    const CRM = 'https://sfac-mu.vercel.app';
    const PHONE = '(970) 851-6433';

    const money = (n) => {
      const v = n ?? 0;
      const cents = Math.abs(v % 1) > 0.0001;
      return new Intl.NumberFormat('en-US', {
        style: 'currency', currency: 'USD',
        minimumFractionDigits: cents ? 2 : 0,
        maximumFractionDigits: cents ? 2 : 0,
      }).format(v);
    };

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const day = (iso) => {
      if (!iso) return '';
      const d = new Date(iso);
      return isNaN(d) ? '' : d.toLocaleDateString('en-US');
    };

    function fail(message) {
      document.getElementById('loading').innerHTML =
        '<h2>' + esc(message) + '</h2>' +
        '<p>Give us a text on ' + PHONE + ' and we will send it again.</p>';
    }

    /** A tick list, with an Interior / Exterior heading when both are present. */
    function incList(items, heading) {
      if (!items || !items.length) return '';
      return (heading ? '<p class="side">' + esc(heading) + '</p>' : '')
        + '<ul class="inc">' + items.map((x) => '<li>' + esc(x) + '</li>').join('') + '</ul>';
    }

    function packageCard(p, best, idx) {
      const discounted = (p.retail ?? 0) > (p.price ?? 0);
      const hasBoth = (p.includesInterior || []).length && (p.includesExterior || []).length;
      let inc = '';
      if ((p.includesInterior || []).length || (p.includesExterior || []).length) {
        inc = incList(p.includesInterior, hasBoth ? 'Interior' : '')
            + incList(p.includesExterior, hasBoth ? 'Exterior' : '');
      } else {
        inc = incList(p.includes, '');
      }
      return ''
        + '<div class="card' + (best ? ' best' : '') + '">'
        +   (best ? '<span class="badge">Recommended</span>' : '')
        +   '<span class="tier">' + esc(p.tierLabel || '') + '</span>'
        +   '<h3 class="name">' + esc(p.label) + '</h3>'
        +   (p.duration ? '<p class="dur">' + esc(p.duration) + '</p>' : '')
        +   '<span class="plab">' + (discounted ? 'Your price' : 'Price') + '</span>'
        +   '<div><span class="price">' + money(p.price) + '</span>'
        +     (discounted ? '<span class="was">' + money(p.retail) + '</span>' : '')
        +   '</div>'
        +   ((p.lines || []).length
              ? '<ul class="lines">' + p.lines.map((l) =>
                  '<li><span>' + esc(l.label) + '</span><span>' + money(l.amount) + '</span></li>').join('') + '</ul>'
              : '')
        +   (p.annualSavings
              ? '<p class="dur" style="color:var(--gold-deep);font-weight:700;margin-top:8px">Saves ' + money(p.annualSavings) + ' a year</p>'
              : '')
        +   '<p class="inc-head">What&rsquo;s Included</p>'
        +   inc
        +   '<button class="pick' + (best ? '' : ' ghost') + '" data-pick="' + idx + '">'
        +     'Book this' + '</button>'
        + '</div>';
    }

    async function load() {
      const id = new URLSearchParams(location.search).get('id');
      if (!id) return fail('This link is missing its quote.');

      let data;
      try {
        const res = await fetch(CRM + '/api/quotes/public?id=' + encodeURIComponent(id));
        if (!res.ok) return fail('We could not find that quote.');
        data = await res.json();
      } catch (e) {
        return fail('We could not load your quote just now.');
      }

      const q = data && data.quote;
      if (!q) return fail('We could not find that quote.');

      const packages = Array.isArray(q.packages) ? q.packages : [];

      // The builder marks what was recommended. Older quotes have no flag, so
      // fall back to the dearest, which is how they were presented.
      let bestIdx = packages.findIndex((p) => p.recommended);
      if (bestIdx < 0 && packages.length) {
        bestIdx = 0;
        packages.forEach((p, i) => { if ((p.price ?? 0) > (packages[bestIdx].price ?? 0)) bestIdx = i; });
      }

      const savings = (q.frequencyDiscountPct || 0) + (q.extraDiscountPct || 0);
      const KIND_TITLE = {
        coating: 'Ceramic Coating Quote',
        maintenance: 'Maintenance Plan Quote',
        fleet: 'Fleet Quote',
      };

      let html = '<div class="sheet">';

      // ── Header ──
      html += ''
        + '<div class="sheet-head">'
        +   '<div class="biz">'
        +     '<img src="/brand_assets/logo-nav.png" alt="Shine for a Cause" />'
        +     '<div>'
        +       '<h1>Shine for a Cause Mobile Detailing</h1>'
        +       '<p>Mobile Auto Detailing · Northern Colorado</p>'
        +       '<p class="fine">Phone: ' + PHONE + '</p>'
        +       '<p class="fine">Email: shineforacausemd@gmail.com</p>'
        +     '</div>'
        +   '</div>'
        +   '<div class="meta">'
        +     '<p class="lab">' + esc(KIND_TITLE[q.kind] || 'Quote') + '</p>'
        +     (q.quoteNumber ? '<p><b>Quote #:</b> ' + esc(q.quoteNumber) + '</p>' : '')
        +     (q.createdAt ? '<p><b>Date:</b> ' + day(q.createdAt) + '</p>' : '')
        +     (q.validUntil ? '<p><b>Valid Until:</b> ' + day(q.validUntil) + '</p>' : '')
        +   '</div>'
        + '</div>';

      // ── Client and service ──
      const details = []
        .concat((q.vehicleSummary || []))
        .concat(q.frequency && q.frequency !== 'one-time' ? [] : (q.kind === 'residential' ? ['One-Time'] : []));
      html += ''
        + '<div class="facts">'
        +   '<div>'
        +     '<h2>Client</h2>'
        +     '<p class="who">' + esc(q.clientName || 'Your quote') + '</p>'
        +   '</div>'
        +   '<div>'
        +     '<h2>Service Details</h2>'
        +     (details.length
                ? details.map((d) => '<p>' + esc(d) + '</p>').join('')
                : '<p>' + esc(q.serviceType || '') + '</p>')
        +     (savings > 0 ? '<p class="save">Includes ' + savings + '% off</p>' : '')
        +   '</div>'
        + '</div>';

      // ── Packages ──
      if (packages.length) {
        if (q.category) html += '<p class="cat">' + esc(q.category) + '</p>';
        html += '<div class="grid">'
          + packages.map((p, i) => packageCard(p, i === bestIdx, i)).join('')
          + '</div>';
      } else if (q.total) {
        html += '<div class="grid"><div class="card best">'
          + '<h3 class="name">' + esc(q.serviceType || 'Your detail') + '</h3>'
          + '<div><span class="price">' + money(q.total) + '</span></div>'
          + '</div></div>';
      }

      // ── Add-ons ──
      if ((q.addonOffers || []).length) {
        html += '<div class="addons"><p class="cat" style="margin-top:0">Add-Ons</p><div class="addon-grid">'
          + q.addonOffers.map((a) => ''
            + '<div class="addon">'
            +   '<div>'
            +     '<p class="an">' + esc(a.name) + '</p>'
            +     (a.description ? '<p class="ad">' + esc(a.description) + '</p>' : '')
            +     ((a.includedIn || []).length
                    ? '<p class="ai">Included in ' + esc(a.includedIn.join(' and ')) + '</p>' : '')
            +   '</div>'
            +   '<span class="ap">+' + money(a.price) + '</span>'
            + '</div>').join('')
          + '</div></div>';
      }

      // ── Notes and terms ──
      html += '<div class="foot-grid">'
        +   '<div class="box"><h3>Notes</h3><p>' + esc(q.notes || 'No additional notes.') + '</p></div>'
        +   (q.terms
              ? '<div class="box"><h3>Terms &amp; Conditions</h3><p class="tiny">' + esc(q.terms) + '</p>'
                + (q.validUntil ? '<p class="valid">Valid for 30 days (through ' + day(q.validUntil) + ').</p>' : '')
                + '</div>'
              : '')
        + '</div>';

      html += '</div>'; // .sheet

      // ── Book ──
      html += ''
        + '<div class="cta">'
        +   '<h2>Ready when you are</h2>'
        +   '<p>Pick your day and time online, or text us and we will sort it out for you.</p>'
        +   '<a class="btn" href="/booking">Book your detail</a>'
        +   '<a class="btn ghost" href="sms:+19708516433">Text ' + PHONE + '</a>'
        + '</div>'
        + '<footer>Shine for a Cause Mobile Detailing · Northern Colorado<br>'
        +   '<a href="/">shineforacause.com</a> · ' + PHONE
        + '</footer>';

      document.getElementById('content').innerHTML = html;
      document.getElementById('loading').style.display = 'none';

      // Picking a package carries it into the booking page's cart, so nobody
      // re-enters a vehicle, a package and a level they already chose here.
      // Only the address and a time are left to give.
      document.querySelectorAll('[data-pick]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const pkg = packages[Number(btn.dataset.pick)];
          if (!pkg) return;
          try {
            localStorage.setItem('sfac_quote', JSON.stringify({
              serviceKey: pkg.key,
              size: q.size || 'mid',
              serviceName: pkg.label,
              pkgLabel: q.category || '',
              // Priced from the catalog, so the booking page can treat it as a
              // normal service: real duration, real price, real calendar.
              priced: true,
              total: pkg.price,
              addons: [],
              quoteId: q.id,
              quoteNumber: q.quoteNumber || '',
              ts: Date.now(),
            }));
          } catch (e) { /* private mode: fall through and book normally */ }
          location.href = '/booking';
        });
      });
    }

    load();
  </script>
</body>
</html>
